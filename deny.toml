# cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally:
#   cargo deny check                    # everything
#   cargo deny check bans licenses sources
#   cargo deny check advisories         # requires fresh advisory-db
#
# Hardening rationale:
#   - wildcards = "deny"        — no `foo = "*"` in our own manifests
#   - multiple-versions = "warn" — transitive duplicates are warned
#                                  (denying would break on common
#                                  ecosystem churn like windows-sys)
#   - unknown-git = "deny"       — every dep must come from crates.io
#   - unknown-registry = "deny"  — no alternate registries
#   - yanked = "deny"            — never depend on a yanked crate
#   - SPDX allow-list is closed  — anything outside the project license
#                                  plus MIT / Apache / ISC / BSD / Zlib /
#                                  MPL / Unicode-3.0 is rejected at build time

[graph]
targets = []

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[bans]
# Tightened from "warn"/"allow" — wildcards in our own manifests are
# never acceptable; transitive duplicates remain a warning so we can
# triage churn without blocking unrelated PRs.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Hardened: no anonymous git deps, no alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared Algol/AXIOM doctrine crates are consumed from git, pinned to an
# exact rev in the workspace manifest so the on-disk audit/receipt bytes are
# identical across the cohort. They are also published to crates.io, and the
# manifest carries `version = "0.1.0"` alongside the git source, so a published
# taudit resolves the registry copy — the git source only applies to builds from
# this source tree. Without this entry `cargo deny check sources` fails, which
# it has done since those deps landed in v1.3.1.
allow-git = ["https://github.com/0ryant/axiom-doctrine-rs"]

[licenses]
version = 2
# Closed allow-list — adding a crate with any other SPDX expression
# fails the build. Add new entries here only after confirming the
# license is compatible with downstream redistribution.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # CDLA-Permissive-2.0 — Community Data License Agreement Permissive 2.0.
    # Used by webpki-roots (Mozilla CA cert bundle), pulled in transitively by
    # ureq. Permissive; allows redistribution with minimal obligations.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
